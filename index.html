<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101113" />
    <script>
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("portfolio-theme");
        } catch {
          /* Device preferences still work when storage is unavailable. */
        }
        let systemTheme = "light";
        try {
          systemTheme = window.matchMedia("(prefers-color-scheme: dark)")
            .matches
            ? "dark"
            : "light";
        } catch {
          /* Use light when the browser cannot report a preference. */
        }
        const theme =
          saved === "light" || saved === "dark" ? saved : systemTheme;
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "light" ? "#ffffff" : "#101113";
      })();
    </script>
    <meta name="author" content="Saagar N Kashyap" />
    <meta property="og:site_name" content="Saagar Kashyap" />
    <meta
      property="og:image"
      content="https://kashyapsaagar.vercel.app/social-preview.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Saagar Kashyap — About me, work experience, and project previews."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://kashyapsaagar.vercel.app/social-preview.jpg"
    />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Saagar Kashyap — Writing"
      href="/rss.xml"
    />
    <link
      rel="preload"
      href="/fonts/geist.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
